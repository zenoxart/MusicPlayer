name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build shaded application jar
        run: mvn clean package

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\package | Out-Null
          Copy-Item target\music-player-1.0-SNAPSHOT-app.jar target\package\app.jar

      - name: Create EXE
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name "MusicPlayer" `
            --input target/package `
            --main-jar app.jar `
            --main-class com.musicplayer.Launcher `
            --icon packaging\app-icon.ico `
            --vendor "ZenoxArt" `
            --dest target/installer `
            --app-version "1.0.0" `
            --win-menu `
            --win-shortcut

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: target/installer/*.exe